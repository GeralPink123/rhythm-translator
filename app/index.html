<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traductor de Ritmos</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#131313;color:#f2ede4;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px}
  .top{display:flex;justify-content:space-between;align-items:center}
  .tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#f5a623;border:2px solid #f5a623;border-radius:999px;padding:6px 12px}
  .lang{font-family:inherit;font-size:13px;font-weight:700;color:#a8a29a;background:#1e1e1e;border:2px solid #33302b;border-radius:999px;padding:7px 12px;cursor:pointer}
  .lang b{color:#f5a623}
  h1{font-size:34px;line-height:1.05;margin:20px 0 6px;letter-spacing:-1px}
  .sub{font-size:15px;color:#a8a29a;margin-bottom:20px}
  .picker{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
  .pcard{background:#1e1e1e;border:2px solid #33302b;border-radius:10px;padding:13px 4px 11px;text-align:center;cursor:pointer;font-family:inherit;color:#f2ede4}
  .pcard .pname{font-size:15px;font-weight:800;letter-spacing:.02em}
  .pcard .pbpm{font-size:11px;color:#a8a29a;margin-top:3px}
  .pcard.cur{border-color:#f5a623;background:#2a2113}
  .pcard.cur .pname{color:#f5a623}
  .pcard.cur .pbpm{color:#f5a623}
  .honest{margin-top:18px;background:#1e1e1e;border:2px solid #f5a623;border-radius:10px;padding:13px 15px;font-size:13px;line-height:1.55;color:#f2ede4}
  .honest b{color:#f5a623}
  .bpmchip{margin:0 auto 18px;width:200px;text-align:center;background:#f5a623;color:#131313;border-radius:10px;padding:12px 0;font-size:26px;font-weight:800;letter-spacing:.04em}
  .grid{margin-bottom:18px}
  .nums,.row,.beats{display:grid;grid-template-columns:96px repeat(16,1fr);gap:4px;align-items:center}
  .nums span{font-size:10px;color:#a8a29a;text-align:center}
  .nums span.corner,.beats span.corner{visibility:hidden}
  .row{margin-top:5px}
  .lbl{font-size:12px;font-weight:700;line-height:1.15}
  .cell{aspect-ratio:1/1;border-radius:5px;background:#232323;border:2px solid #3a3a3a;cursor:pointer;padding:0}
  .cell.on{background:#f5a623;border-color:#d18a0e}
  .cell.now{outline:2px solid #f2ede4;outline-offset:1px}
  button{touch-action:manipulation}
  .cell:focus-visible,.pcard:focus-visible,.play:focus-visible,.actions button:focus-visible,.lang:focus-visible{outline:2px solid #f5a623;outline-offset:2px}
  .beats{margin-top:7px}
  .beats span{font-size:11px;color:#a8a29a;text-align:center}
  .play{width:100%;padding:16px 0;font-size:19px;font-weight:800;border:0;border-radius:10px;background:#f5a623;color:#131313;cursor:pointer;font-family:inherit}
  .play.stop{background:#33302b;color:#f2ede4}
  .rules{margin-top:22px}
  .rules h2{font-size:19px;margin-bottom:10px}
  .rules li{font-size:14px;line-height:1.55;margin-bottom:8px;list-style:none}
  .rules li b{color:#f5a623}
  .rules li::before{content:"> ";color:#f5a623;font-weight:800}
  .actions{display:flex;gap:10px;margin-top:22px}
  .actions button{flex:1;padding:13px 0;font-size:15px;font-weight:700;border:2px solid #f5a623;border-radius:12px;background:transparent;color:#f5a623;cursor:pointer;font-family:inherit}
  .actions button.ghost{border-color:#55504a;color:#a8a29a}
  .actions button:disabled{opacity:.5;cursor:default}
  footer{margin-top:26px;text-align:center;font-size:12px;color:#a8a29a;line-height:1.6}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="tag" id="tag">Proyecto GitHub</span>
    <button class="lang" id="langBtn" aria-label="Cambiar idioma"><b>ES</b> | EN</button>
  </div>
  <h1 id="title">Traductor de Ritmos</h1>
  <p class="sub" id="subtitle">Trap, dembow, plena y bomba, con reglas claras.</p>

  <div class="picker" id="picker">
    <button type="button" class="pcard cur" data-genre="trap"><span class="pname">TRAP</span><br><span class="pbpm">140 BPM</span></button>
    <button type="button" class="pcard" data-genre="dembow"><span class="pname">DEMBOW</span><br><span class="pbpm">110 BPM</span></button>
    <button type="button" class="pcard" data-genre="plena"><span class="pname">PLENA</span><br><span class="pbpm">104 BPM</span></button>
    <button type="button" class="pcard" data-genre="bomba"><span class="pname">BOMBA</span><br><span class="pbpm">98 BPM</span></button>
  </div>
  <div class="bpmchip" id="bpmChip">140 BPM</div>

  <div class="grid" id="grid"></div>

  <button class="play" id="playBtn">&#9654; Tocar el trap</button>

  <div class="honest" id="honest"></div>

  <div class="rules">
    <h2 id="rulesTitle">Qu&eacute; cambi&oacute; en la traducci&oacute;n</h2>
    <ul id="rulesList"></ul>
  </div>

  <div class="actions">
    <button id="wavBtn">&#11015; Bajar en WAV</button>
    <button id="resetBtn" class="ghost">&#8635; Restablecer</button>
  </div>

  <footer id="footer">Gratis, en el navegador, sin cuenta ni instalaci&oacute;n.</footer>
</div>
<pre id="selftest" hidden></pre>

function clonePattern(p) {
  return { name: p.name, bpm: p.bpm, rows: p.rows.map(r => ({ id: r.id, labelEs: r.labelEs, labelEn: r.labelEn, steps: r.steps.slice(), delay: r.delay || 0, tones: r.tones ? JSON.parse(JSON.stringify(r.tones)) : undefined, defaultSample: r.defaultSample })) };
}
// Copias de trabajo: lo que el usuario edita se queda aunque traduzca y vuelva.
const WORK = { trap: clonePattern(TRAP_CANON), dembow: clonePattern(DEMBOW_CANON), plena: clonePattern(PLENA_CANON), bomba: clonePattern(BOMBA_CANON) };
// Pasos que suenan de verdad en un compas, segun el genero y el numero de compas.
// Requinto: improvisa, una variacion por vuelta. Quinto: responde, una variacion
// por vuelta; en el compas 8 de la vuelta cierra con el fill (pasos 13-16).
function effectiveSteps(pattern, row, bar) {
  if (row.id === "requinto") return REQUINTO_VARS[bar % 4];
  if (pattern.name === "Bomba" && row.id === "quinto") {
    if (bar % 8 === 7) return BOMBA_FILL;
    return QUINTO_VARS[bar % 4];
  }
  return row.steps;
}
function toneAt(row, step) {
  return (row.tones && row.tones[step]) || null;
}

// heredan de la v2.1: la alfombra muteada va baja para que sea cama y no
// tape al quinto, y el golpe abierto iguala en energia al quinto

const player = { playing: false, step: 0, bar: 0, nextTime: 0, timer: null, raf: null, startTime: 0, master: null, chain: null };
const playBtn = document.getElementById("playBtn");
function t(key) { return I18N[lang][key]; }
function playLabel() { return t("play")[current]; }
function scheduleStep(step, time, bar) {
  const p = curPattern();
  const stepDur = 60 / p.bpm / 4;
  const kickRow = p.rows.find(r => r.id === "kick");
  const kickHere = kickRow && kickRow.steps.indexOf(step) !== -1;
  if (kickHere) duckBass(player.chain.bassBus, time);
  for (const row of p.rows) {
    if (effectiveSteps(p, row, bar).indexOf(step) !== -1) {
      const tt = time + (row.delay || 0) + grooveAt(p, step);
      playSound(audioCtx, row.id, tt, player.chain, soundOpts(p, row, step, bar, kickHere, stepDur, tt));
    }
  }
}
function tick() {
  const ahead = 0.12;
  const stepDur = 60 / curPattern().bpm / 4;
  while (player.nextTime < audioCtx.currentTime + ahead) {
    scheduleStep(player.step, player.nextTime, player.bar);
    player.nextTime += stepDur;
    player.step = (player.step + 1) % 16;
    if (player.step === 0) player.bar++;
  }
}
function draw() {
  if (!player.playing) return;
  const stepDur = 60 / curPattern().bpm / 4;
  const elapsed = audioCtx.currentTime - player.startTime;
  const cur = Math.floor(elapsed / stepDur) % 16;
  gridEl.querySelectorAll(".cell").forEach(c => c.classList.toggle("now", Number(c.dataset.step) === cur));
  player.raf = requestAnimationFrame(draw);
}
function startPlay() {
  const ctx = getCtx();
  player.chain = buildMasterChain(ctx, current);
  player.master = player.chain.master;
  player.playing = true; player.step = 0; player.bar = 0;
  player.startTime = ctx.currentTime + 0.05;
  player.nextTime = player.startTime;
  player.timer = setInterval(tick, 30);
  tick();
  draw();
  playBtn.textContent = t("stop");
  playBtn.classList.add("stop");
}
function stopPlay(done) {
  // Apagado limpio: fundido rapido de 0.05 s para no dejar clics.
  player.playing = false;
  if (player.timer) clearInterval(player.timer);
  if (player.raf) cancelAnimationFrame(player.raf);
  const m = player.master;
  if (m) {
    try {
      m.gain.setTargetAtTime(0, audioCtx.currentTime, 0.02);
    } catch (e) { /* sin contexto */ }
  }
  setTimeout(() => {
    gridEl.querySelectorAll(".cell").forEach(c => c.classList.remove("now"));
    player.master = null; player.chain = null;
    playBtn.textContent = playLabel();
    playBtn.classList.remove("stop");
    if (done) done();
  }, 90);
}
playBtn.addEventListener("click", () => {
  if (player.playing) stopPlay();
  else startPlay();
});

// ---- Traducir (4 generos) ----
const bpmChip = document.getElementById("bpmChip");
const rulesList = document.getElementById("rulesList");
const pickerEl = document.getElementById("picker");
function applyDirection() {
  const p = WORK[current];
  bpmChip.textContent = p.bpm + " BPM";
  playBtn.textContent = playLabel();
  pickerEl.querySelectorAll(".pcard").forEach(c => c.classList.toggle("cur", c.dataset.genre === current));
  const rules = I18N[lang].rules[current];
  rulesList.innerHTML = rules.map(r => "<li><b>" + r[0] + "</b>" + r[1] + "</li>").join("");
  document.getElementById("rulesTitle").textContent = t("rulesTitle");
  document.getElementById("honest").innerHTML = t("honest");
}
function goToGenre(genre) {
  if (genre === current) return;
  // Mezcla de DJ: si estaba sonando, el tema no se para; el nuevo patron
  // entra con energia despues del fundido.
  const wasPlaying = player.playing;
  const finish = () => {
    current = genre;
    buildGrid();
    applyDirection();
    if (wasPlaying) startPlay();
  };
  if (wasPlaying) stopPlay(finish);
  else finish();
}
pickerEl.querySelectorAll(".pcard").forEach(c => c.addEventListener("click", () => goToGenre(c.dataset.genre)));

// ---- Idioma ES/EN ----
const langBtn = document.getElementById("langBtn");
function applyLang() {
  langBtn.innerHTML = lang === "es" ? "<b>ES</b> | EN" : "ES | <b>EN</b>";
  document.getElementById("tag").textContent = t("tag");
  document.getElementById("subtitle").textContent = t("subtitle");
  document.getElementById("wavBtn").textContent = t("wav");
  document.getElementById("resetBtn").innerHTML = t("reset");
  document.getElementById("footer").textContent = t("footer");
  document.documentElement.lang = lang;
  buildGrid();
  applyDirection();
}
langBtn.addEventListener("click", () => { lang = lang === "es" ? "en" : "es"; applyLang(); });

// ---- Exportar WAV y restablecer ----
const wavBtn = document.getElementById("wavBtn");
wavBtn.addEventListener("click", async (e) => {
  const btn = e.currentTarget;
  const old = btn.textContent;
  btn.textContent = t("wavBusy");
  btn.disabled = true;
  try {
    const res = await exportWav(curPattern());
    const a = document.createElement("a");
    a.href = URL.createObjectURL(res.blob);
    a.download = "traductor-" + current + ".wav";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    btn.textContent = old;
  } catch (err) {
    btn.textContent = t("wavFail");
    setTimeout(() => { btn.textContent = t("wav"); }, 3000);
  }
  btn.disabled = false;
});
document.getElementById("resetBtn").addEventListener("click", () => {
  const finish = () => {
    WORK[current] = clonePattern(CANON[current]);
    buildGrid();
  };
  if (player.playing) stopPlay(finish);
  else finish();
});

// ---- Arranque (?genre=plena|bomba|dembow|trap para abrir en un genero) ----
const startGenre = new URLSearchParams(location.search).get("genre");
if (startGenre && CANON[startGenre]) current = startGenre;
// Arranque con applyLang() (no solo buildGrid + applyDirection): es la
// unica funcion que escribe el pie, asi que sin ella el pie no decia
// "v2.4" en la primera carga (solo tras pulsar el boton de idioma).
// applyLang() ya llama a buildGrid() y a applyDirection().
applyLang();

// ---- Para verificacion ----
window.__app = {
  get current() { return current; },
  get lang() { return lang; },
  get WORK() { return WORK; },
  get CANON() { return CANON; },
  get TRAP_CANON() { return TRAP_CANON; },
  get DEMBOW_CANON() { return DEMBOW_CANON; },
  get PLENA_CANON() { return PLENA_CANON; },
  get BOMBA_CANON() { return BOMBA_CANON; },
  get MASTER_GAIN() { return MASTER_GAIN; },
  get player() { return player; },
  goToGenre, effectiveSteps, exportBars, truePeak4x,
  samplesReady, renderPattern, measureLufs, exportWav, buildGrid, applyDirection
};

// Muestreo con interpolacion cubica (Catmull-Rom) en una posicion fraccionaria.
// La lineal falla en los ataques (contenido cerca de Nyquist) y marca
// diferencias falsas entre compases que si son periodicos.
function interp(d, pos) {
  const i = Math.floor(pos), f = pos - i;
  const p0 = (i - 1 >= 0) ? d[i - 1] : 0;
  const p1 = d[i] || 0;
  const p2 = (i + 1 < d.length) ? d[i + 1] : 0;
  const p3 = (i + 2 < d.length) ? d[i + 2] : 0;
  return 0.5 * ((2 * p1) + (-p0 + p2) * f + (2 * p0 - 5 * p1 + 4 * p2 - p3) * f * f + (-p0 + 3 * p1 - 3 * p2 + p3) * f * f * f);
}

// ---- Autoprueba (?selftest=1) ----
if (new URLSearchParams(location.search).get("selftest") === "1") {
  (async () => {
    const res = { errors: window.__errors.slice(), steps: {} };
    try {
      await samplesReady;
      res.samples = {};
      for (const k of Object.keys(SAMPLE_BUFFERS)) res.samples[k] = +SAMPLE_BUFFERS[k].duration.toFixed(3);
      // LUFS del loop completo y true peak, por genero (render en vivo).
      res.perChannel = {};
      for (const g of GENRE_ORDER) {
        const pat = WORK[g];
        const bars = exportBars(pat);
        const full = await renderPattern(pat, bars);
        const mFull = await measureLufs(full, bars, pat.bpm);
        res.perChannel[g] = { bars, loop: mFull, truePeak: truePeak4x(full), rows: {} };
        for (const row of pat.rows) {
          const solo = { name: pat.name, bpm: pat.bpm, rows: [{ id: row.id, steps: row.steps, tones: row.tones, defaultSample: row.defaultSample }] };
          const buf = await renderPattern(solo, bars);
          res.perChannel[g].rows[row.id] = await measureLufs(buf, bars, pat.bpm);
        }
      }
      // Loop redondo: en regimen, un compas es copia del anterior (el primer
      // compas arranca limpio, sin la cola del anterior). Se comparan los
      // pares de compases 1-2 y 2-3 de un render de 4 compases. La plena
      // varia por el requinto, asi que ahi solo se mira el salto en la frontera.
      // La bomba varia por el quinto (una variacion por vuelta, ciclo de 4),
      // asi que se renderizan 8 compases y se comparan compases con la MISMA
      // variacion: 0-4, 1-5 y 2-6. El barRms tiene que seguir estable.
      res.steps.roundness = {};
      for (const g of ["trap", "dembow", "bomba"]) {
        const pat = WORK[g];
        const nBars = (g === "bomba") ? 8 : 4;
        const buf = await renderPattern(pat, nBars);
        const stepDur = 60 / pat.bpm / 4, sr = buf.sampleRate, nF = sr * stepDur * 16;
        const pairDiff = [];
        let maxJump = 0;
        const b0 = Math.round(nF);
        for (let c = 0; c < buf.numberOfChannels; c++) {
          const d = buf.getChannelData(c);
          maxJump = Math.max(maxJump, Math.abs(d[b0] - d[b0 - 1]));
        }
        const pairIdx = (g === "bomba") ? [[0, 4], [1, 5], [2, 6]] : [[0, 1], [1, 2], [2, 3]];
        for (const [pa, pb] of pairIdx) {
          let md = 0;
          const n = Math.floor(nF);
          for (let c = 0; c < buf.numberOfChannels; c++) {
            const d = buf.getChannelData(c);
            for (let i = 0; i < n; i++) {
              const a = interp(d, pa * nF + i), b = interp(d, pb * nF + i);
              md = Math.max(md, Math.abs(a - b));
            }
          }
          pairDiff.push(+md.toFixed(5));
        }
        // RMS por compas: la redondez de verdad es que cada compas suene
        // igual de fuerte. La diferencia de detalle en las colas (dembow:
        // bajo y caja con cola larga) es inaudible; lo que importa es que
        // no haya clic en la frontera y que el nivel no cambie de compas.
        const barRms = [];
        const d0 = buf.getChannelData(0);
        for (let b = 0; b < nBars; b++) {
          let sum = 0, n = 0;
          const start = Math.round(b * nF), end = Math.min(d0.length, Math.round((b + 1) * nF));
          for (let i = start; i < end; i++) { sum += d0[i] * d0[i]; n++; }
          barRms.push(+Math.sqrt(sum / n).toFixed(5));
        }
        res.steps.roundness[g] = { pairDiff, boundaryJump: +maxJump.toFixed(5), barRms };
      }
      {
        const pat = WORK.plena;
        const buf = await renderPattern(pat, 2);
        const stepDur = 60 / pat.bpm / 4, sr = buf.sampleRate, n = Math.floor(sr * stepDur * 16);
        let maxJump = 0;
        for (let c = 0; c < buf.numberOfChannels; c++) {
          const d = buf.getChannelData(c);
          maxJump = Math.max(maxJump, Math.abs(d[n] - d[n - 1]));
        }
        res.steps.roundness.plena = { boundaryJump: +maxJump.toFixed(5) };
      }
      // Requinto improvisa: 4 vueltas distintas. Bomba: fill en el compas 8.
      const req = WORK.plena.rows.find(r => r.id === "requinto");
      res.steps.requintoVars = [0, 1, 2, 3].map(b => effectiveSteps(WORK.plena, req, b).join(","));
      const q = WORK.bomba.rows.find(r => r.id === "quinto");
      res.steps.bombaFill = { bar0: effectiveSteps(WORK.bomba, q, 0).join(","), bar7: effectiveSteps(WORK.bomba, q, 7).join(",") };
      // Quinto responde: 4 variaciones distintas. La plena ya no comparte
      // el patron del bajo del dembow (regresion de la v2: seguidor [0,6,8,14]).
      res.steps.quintoVars = [0, 1, 2, 3].map(b => effectiveSteps(WORK.bomba, q, b).join(","));
      res.steps.plenaNotDembow = WORK.plena.rows.find(r => r.id === "seguidor").steps.join(",") !== WORK.dembow.rows.find(r => r.id === "bass").steps.join(",");
      // Traducir por los 4 generos con el selector.
      res.steps.genres = {};
      for (const g of ["dembow", "plena", "bomba", "trap"]) {
        document.querySelector('.pcard[data-genre="' + g + '"]').click();
        await new Promise(r => setTimeout(r, 120));
        res.steps.genres[g] = { current, bpm: document.getElementById("bpmChip").textContent, play: document.getElementById("playBtn").textContent, rules: document.getElementById("rulesList").children.length, rows: WORK[g].rows.map(r => r.id + ":" + r.steps.join(",")) };
      }
      // Traducir en vivo sin parar: arranca, cambia de genero, sigue sonando.
      try {
        document.getElementById("playBtn").click();
        await new Promise(r => setTimeout(r, 150));
        const playingBefore = window.__app.player.playing;
        document.querySelector('.pcard[data-genre="plena"]').click();
        await new Promise(r => setTimeout(r, 350));
        res.steps.liveTranslate = { playingBefore, playingAfter: window.__app.player.playing, current };
        document.getElementById("playBtn").click();
        await new Promise(r => setTimeout(r, 150));
      } catch (e) { res.steps.liveTranslate = { error: String(e) }; }
      document.querySelector('.pcard[data-genre="trap"]').click();
      await new Promise(r => setTimeout(r, 120));
      // Toggle de una celda (plena, seguidor).
      document.querySelector('.pcard[data-genre="plena"]').click();
      await new Promise(r => setTimeout(r, 120));
      const cell = document.querySelector('.cell[data-row="seguidor"][data-step="1"]');
      const before = WORK.plena.rows[0].steps.slice();
      cell.click();
      const afterToggle = WORK.plena.rows[0].steps.slice();
      cell.click();
      const afterToggleBack = WORK.plena.rows[0].steps.slice();
      res.steps.toggle = { before, afterToggle, afterToggleBack, cellClassAfter: cell.classList.contains("on") };
      // Toggle EN: todas las etiquetas, incluida la nota honesta.
      document.getElementById("langBtn").click();
      await new Promise(r => setTimeout(r, 100));
      res.steps.en = { play: document.getElementById("playBtn").textContent, rulesTitle: document.getElementById("rulesTitle").textContent, footer: document.getElementById("footer").textContent, honest: document.getElementById("honest").textContent.slice(0, 60), rowLabel: document.querySelector(".lbl").textContent, rules0: document.getElementById("rulesList").children[0].textContent.slice(0, 60) };
      document.getElementById("langBtn").click();
      await new Promise(r => setTimeout(r, 100));
      res.steps.backEs = { play: document.getElementById("playBtn").textContent, honest: document.getElementById("honest").textContent.slice(0, 40) };
      // Export WAV de los 4 generos: RIFF valido, LUFS y true peak del archivo final.
      res.steps.wav = {};
      for (const g of GENRE_ORDER) {
        const exp = await exportWav(WORK[g]);
        const head = new Uint8Array(await exp.blob.slice(0, 44).arrayBuffer());
        const riff = String.fromCharCode.apply(null, head.slice(0, 4));
        const wave = String.fromCharCode.apply(null, head.slice(8, 12));
        const dec = new OfflineAudioContext(1, 1, 44100);
        const back = await dec.decodeAudioData(await exp.blob.arrayBuffer());
        const bars = exportBars(WORK[g]);
        const mBack = await measureLufs(back, bars, WORK[g].bpm);
        res.steps.wav[g] = { size: exp.blob.size, riff, wave, before: exp.before, gain: exp.gain, lufsAfter: exp.lufsAfter, peakAfter: exp.peakAfter, lufsDecoded: mBack.lufs, truePeakDecoded: truePeak4x(back) };
      }
      res.ok = true;
    } catch (err) {
      res.ok = false;
      res.error = String(err && err.message || err);
    }
    res.errors = window.__errors.slice();
    const pre = document.getElementById("selftest");
    pre.hidden = false;
    pre.textContent = JSON.stringify(res);
    document.title = "SELFTEST-DONE";
  })();
}
</script>
